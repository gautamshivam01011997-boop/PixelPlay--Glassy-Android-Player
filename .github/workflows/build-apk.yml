name: Build PixelPlay APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find PixelPlay project ZIP
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 4 -type f -iname '*PixelPlay*Android*Project*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: PixelPlay Android project ZIP nahi mili."
            find . -maxdepth 4 -type f
            exit 1
          fi
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "ZIP found: $ZIP_FILE"

      - name: Extract Android project ZIP
        run: |
          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted

      - name: Find Android project
        shell: bash
        run: |
          SETTINGS_FILE="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: ZIP ke andar settings.gradle nahi mili."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_ENV"
          echo "Project found: $(dirname "$SETTINGS_FILE")"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelPlay-debug-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error